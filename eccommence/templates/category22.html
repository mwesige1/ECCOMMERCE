{% extends 'main.html' %}
{% load static %}
        {% block content %}

    <!-- Filters and Sorting -->
    <section class="filters-section">
        <div class="filters-container">
            <div class="filter-group">
                <span class="filter-label">Filter by:</span>
                <select class="filter-select">
                    <option>All Products</option>
                    <option>Smartphones</option>
                    <option>Laptops</option>
                    <option>Audio</option>
                    <option>Accessories</option>
                </select>
                
                <select class="filter-select">
                    <option>All Brands</option>
                    <option>Apple</option>
                    <option>Samsung</option>
                    <option>Sony</option>
                    <option>LG</option>
                </select>
                
                <select class="filter-select">
                    <option>Price Range</option>
                    <option>Under $50</option>
                    <option>$50 - $200</option>
                    <option>$200 - $500</option>
                    <option>Over $500</option>
                </select>
            </div>
            
            <div class="filter-group">
                <span class="filter-label">Sort by:</span>
                <select class="filter-select">
                    <option>Featured</option>
                    <option>Price: Low to High</option>
                    <option>Price: High to Low</option>
                    <option>Highest Rated</option>
                    <option>Newest First</option>
                </select>
                
                <div class="view-options">
                    <button class="view-btn active" title="Grid View">
                        <i class="fas fa-th"></i>
                    </button>
                    <button class="view-btn" title="List View">
                        <i class="fas fa-list"></i>
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- Products Grid -->
    <section class="products-section">
        <div class="products-grid" id="productsGrid">

            {% for product in products %}
            <div class="product-card">

                {% if product.is_onsale %}
                <div class="product-badge">Sale</div>
                {% else %}
                <div class="product-badge">New</div>
                {% endif %}

                <img src="{{ product.image.url }}" class="product-image">

                <div class="product-content">
                    <h3 class="product-title">{{ product.name }}</h3>
                    <p class="product-description">{{ product.description }}</p>

                    <div class="product-price">
                        <span class="current-price">UGX {{ product.sale_price }}</span>
                    </div>

                    <div class="product-rating">
                        <div class="stars">
                            <i class="fas fa-star"></i>
                            <i class="fas fa-star"></i>
                            <i class="fas fa-star"></i>
                            <i class="fas fa-star"></i>
                            <i class="far fa-star"></i>
                        </div>
                        <span class="rating-count">(95)</span>
                    </div>

                    <div class="product-actions">
                        <button class="btn-cart">Add to Cart</button>
                        <button class="btn-wishlist"><i class="far fa-heart"></i></button>
                    </div>
                </div>
            </div>
            {% endfor %}

        </div>

        <br><br>

        <!-- Pagination -->
        <div class="pagination">
            <button class="pagination-btn" disabled>
                <i class="fas fa-chevron-left"></i> Previous
            </button>
            
            <div class="pagination-numbers">
                <button class="page-number active">1</button>
                <button class="page-number">2</button>
                <button class="page-number">3</button>
                <button class="page-number">4</button>
                <button class="page-number">5</button>
            </div>
            
            <button class="pagination-btn">
                Next <i class="fas fa-chevron-right"></i>
            </button>
        </div>

    </section>

    <!-- Quick View Modal -->
    <div class="modal" id="quickViewModal">
        <div class="modal-content">
            <button class="modal-close" id="modalClose">
                <i class="fas fa-times"></i>
            </button>
        </div>
    </div>
    <script>
        // View Toggle
        const viewButtons = document.querySelectorAll('.view-btn');
        const productsGrid = document.getElementById('productsGrid');

        viewButtons.forEach(button => {
            button.addEventListener('click', () => {
                viewButtons.forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');
                
                if (button.querySelector('.fa-list')) {
                    productsGrid.style.gridTemplateColumns = '1fr';
                    productsGrid.classList.add('list-view');
                } else {
                    productsGrid.style.gridTemplateColumns = 'repeat(auto-fill, minmax(280px, 1fr))';
                    productsGrid.classList.remove('list-view');
                }
            });
        });

        // Add to Cart Functionality
        document.querySelectorAll('.btn-cart').forEach(button => {
            button.addEventListener('click', function() {
                const productTitle = this.closest('.product-card').querySelector('.product-title').textContent;
                
                // Show notification
                const notification = document.createElement('div');
                notification.textContent = `${productTitle} added to cart!`;
                notification.style.cssText = `
                    position: fixed;
                    top: 100px;
                    right: 20px;
                    background: var(--success-green);
                    color: white;
                    padding: 1rem 1.5rem;
                    border-radius: 10px;
                    z-index: 10000;
                    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
                    animation: slideInRight 0.3s ease;
                `;
                document.body.appendChild(notification);
                
                setTimeout(() => {
                    notification.style.animation = 'slideOutRight 0.3s ease';
                    setTimeout(() => {
                        document.body.removeChild(notification);
                    }, 300);
                }, 3000);
            });
        });

        // Wishlist Toggle
        document.querySelectorAll('.btn-wishlist').forEach(button => {
            button.addEventListener('click', function() {
                const icon = this.querySelector('i');
                if (icon.classList.contains('far')) {
                    icon.classList.replace('far', 'fas');
                    icon.style.color = 'var(--accent-orange)';
                } else {
                    icon.classList.replace('fas', 'far');
                    icon.style.color = '';
                }
            });
        });

        // Pagination
        document.querySelectorAll('.page-number').forEach(button => {
            button.addEventListener('click', function() {
                document.querySelectorAll('.page-number').forEach(btn => {
                    btn.classList.remove('active');
                });
                this.classList.add('active');
            });
        });

        // Modal functionality
        const modal = document.getElementById('quickViewModal');
        const modalClose = document.getElementById('modalClose');

        modalClose.addEventListener('click', () => {
            modal.style.display = 'none';
        });

        // Close modal when clicking outside
        window.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.style.display = 'none';
            }
        });

        // Add CSS for animations
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideInRight {
                from {
                    transform: translateX(100%);
                    opacity: 0;
                }
                to {
                    transform: translateX(0);
                    opacity: 1;
                }
            }
            
            @keyframes slideOutRight {
                from {
                    transform: translateX(0);
                    opacity: 1;
                }
                to {
                    transform: translateX(100%);
                    opacity: 0;
                }
            }
            
            .products-grid.list-view .product-card {
                display: flex;
                align-items: center;
            }
            
            .products-grid.list-view .product-image {
                width: 200px;
                height: 150px;
                flex-shrink: 0;
            }
            
            .products-grid.list-view .product-content {
                flex: 1;
            }
        `;
        document.head.appendChild(style);
    </script>
    {% endblock %}
