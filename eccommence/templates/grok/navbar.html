 <!-- Same Header with Account Dropdown -->
    <header class="amazon-header">
        <div class="header-container">
            <a href="{% url 'eccommence:home' %}" class="logo-section">
                <i class="fas fa-box-open logo-icon"></i>
                <span class="logo-text">HOMIES</span>
            </a>

            <div class="delivery-info">
                <i class="fas fa-map-marker-alt"></i>
                <div>
                    <div class="delivery-location">Deliver to</div>
                    <div class="delivery-text">Kampala 256</div>
                </div>
            </div>

           <div class="search-section">
    <select class="search-select" onchange="if(this.value) window.location.href=this.value;">
    <option value="" disabled selected>Categories</option>

    {% for category in all_categories %}
        {% if category.slug %}
            <option value="{% url 'eccommence:category' category.slug %}">
                {{ category.name }}
            </option>
        {% endif %}
    {% endfor %}
</select>


    <input type="text" class="search-input" placeholder="Search homies">
    <button class="search-button"><i class="fas fa-search"></i></button>
</div>


            <div class="header-nav">
                <button class="theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></button>
                
                <!-- Account Dropdown -->
                <div class="account-dropdown">
                    <div class="account-trigger" id="accountTrigger">
                        <div class="nav-item-primary"><span>Hello, {{ user.first_name }}</span></div>
                        <div class="nav-item-secondary"><i class="fas fa-user"></i>&nbsp;Account & Lists</div>
                                

                    </div>
                    
                    <div class="dropdown-content" id="dropdownContent">
                        <div class="dropdown-header">
                            <div class="user-avatar">
                                <img src="{{ user.profile.profile_picture.url }}" alt="" width="150">
                            </div>
                            <div class="user-info">
                                <h3>{{ user.first_name }} {{ user.last_name }}</h3>
                                <p>{{ user.email }}</p>
                            </div>
                        </div>
                        
                        <div class="dropdown-links">
                            <a href="{% url 'update_user' %}" class="dropdown-link">
                                <i class="fas fa-user"></i>
                                My Profile
                            </a>
                            <a href="orders.html" class="dropdown-link">
                                <i class="fas fa-shopping-bag"></i>
                                My Orders
                            </a>
                            <a href="wishlist.html" class="dropdown-link">
                                <i class="fas fa-heart"></i>
                                My Wishlist
                            </a>
                            <a href="{% url 'user_info' %}" class="dropdown-link">
                                <i class="fas fa-map-marker-alt"></i>
                                My Addresses
                            </a>
                            <a href="{% url 'payment:payment_success' %}" class="dropdown-link">
                                <i class="fas fa-map-marker-alt"></i>
                                Payments
                            </a>
                            <div class="dropdown-divider"></div>
                            
                            <a href="security.html" class="dropdown-link">
                                <i class="fas fa-shield-alt"></i>
                                Security Settings
                            </a>
                            <a href="notifications.html" class="dropdown-link">
                                <i class="fas fa-bell"></i>
                                Notifications
                            </a>
                        </div>
                        
                        <div class="dropdown-footer">
                            <a href="{% url 'logout' %}" class="sign-out-btn">
                                <i class="fas fa-sign-out-alt"></i>
                                Sign Out
                            </a>
                        </div>
                    </div>
                </div>
                
                <a href="#" class="nav-item">
                    <div class="nav-item-primary">Returns</div>
                    <div class="nav-item-secondary">& Orders</div>
                </a>
                <a href="{% url 'cart:cart_summary' %}" class="cart-section">
                    <i class="fas fa-shopping-cart" style="font-size: 2rem;"></i>
                    <div class="cart-count">{{ cart|length }}</div>
                    <div style="margin-top: 15px; font-weight: 700;">Cart</div>
                </a>
            </div>
        </div>
        <script>
              // Account Dropdown Functionality
        const accountTrigger = document.getElementById('accountTrigger');
        const dropdownContent = document.getElementById('dropdownContent');
        let dropdownOpen = false;

        accountTrigger.addEventListener('click', function(e) {
            e.stopPropagation();
            dropdownOpen = !dropdownOpen;
            
            if (dropdownOpen) {
                dropdownContent.classList.add('show');
            } else {
                dropdownContent.classList.remove('show');
            }
        });

        document.addEventListener('click', function(event) {
            if (!accountTrigger.contains(event.target) && !dropdownContent.contains(event.target)) {
                dropdownContent.classList.remove('show');
                dropdownOpen = false;
            }
        });
        </script>
    </header>
