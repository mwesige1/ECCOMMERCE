

{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop by Category - Homies</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="{% static 'css/styles.css' %}" rel="stylesheet">
 <!--jquery cdn --> 
   <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
</head>
<body>
{% if messages %}  
{% for message in messages %}
<div class="alert alert-info">{{ message }}</div>
{% endfor %}
{% endif %}


{% include 'grok/navbar.html' %}

{% block content %}{% endblock %}





{% include 'grok/footer.html' %}


   

    


    <script>
        // Dark Mode Toggle
        const themeToggle = document.getElementById('themeToggle');
        let isDarkMode = false;

        themeToggle.addEventListener('click', () => {
            isDarkMode = !isDarkMode;
            document.body.classList.toggle('dark-mode');
            themeToggle.innerHTML = isDarkMode ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
        });

        // Account Dropdown Functionality
        const accountTrigger = document.getElementById('accountTrigger');
        const dropdownContent = document.getElementById('dropdownContent');
        let dropdownOpen = false;

        // Toggle dropdown on click
        accountTrigger.addEventListener('click', function(e) {
            e.stopPropagation();
            dropdownOpen = !dropdownOpen;
            
            if (dropdownOpen) {
                dropdownContent.classList.add('show');
            } else {
                dropdownContent.classList.remove('show');
            }
        });

        // Close dropdown when clicking outside
        document.addEventListener('click', function(event) {
            if (!accountTrigger.contains(event.target) && !dropdownContent.contains(event.target)) {
                dropdownContent.classList.remove('show');
                dropdownOpen = false;
            }
        });

        // Close dropdown when clicking on a dropdown link
        document.querySelectorAll('.dropdown-link').forEach(link => {
            link.addEventListener('click', function() {
                dropdownContent.classList.remove('show');
                dropdownOpen = false;
            });
        });

        // Sign Out Button Functionality
        document.querySelector('.sign-out-btn').addEventListener('click', function(e) {
            e.stopPropagation();
            if (confirm('Are you sure you want to sign out?')) {
                alert('You have been signed out successfully.');
                dropdownContent.classList.remove('show');
                dropdownOpen = false;
                // In a real application, this would redirect to login page
                // window.location.href = 'login.html';
            }
        });

        // Close dropdown when pressing Escape key
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape' && dropdownOpen) {
                dropdownContent.classList.remove('show');
                dropdownOpen = false;
            }
        });
        
    </script>
</body>
</html>
