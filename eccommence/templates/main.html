        <script>
    // Add to cart functionality (needs product data)
    document.querySelectorAll('.btn-cart').forEach(button => {
        button.addEventListener('click', function() {
            const productTitle = this.closest('.product-card').querySelector('.product-title').textContent;
            const badge = document.querySelector('.btn-icon[title="Cart"] .badge');
            let count = parseInt(badge.textContent);
            badge.textContent = count + 1;
            
            // Show a temporary notification
            const notification = document.createElement('div');
            notification.textContent = `${productTitle} added to cart!`;
            notification.style.cssText = `
                position: fixed;
                top: 100px;
                right: 20px;
                background: var(--success-green);
                color: white;
                padding: 1rem 1.5rem;
                border-radius: 10px;
                z-index: 10000;
                box-shadow: 0 5px 15px rgba(0,0,0,0.3);
                animation: slideInRight 0.3s ease;
            `;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.style.animation = 'slideOutRight 0.3s ease';
                setTimeout(() => {
                    document.body.removeChild(notification);
                }, 300);
            }, 3000);
        });
    });

    // Product popup functionality (page-specific)
    const productPopup = document.getElementById('productPopup');
    const popupClose = document.getElementById('popupClose');
    const productImages = document.querySelectorAll('.product-image');
    
    if (productPopup && popupClose) {
        // Add click event to product images
        productImages.forEach((image, index) => {
            image.addEventListener('click', () => {
                let productId;
                if (index === 2) { // Sony headphones
                    productId = 'sony-headphones';
                } else if (index === 0) { // Samsung phone
                    productId = 'samsung-phone';
                } else if (index === 1) { // iPhone
                    productId = 'iphone';
                } else if (index === 3) { // MacBook
                    productId = 'macbook';
                } else if (index === 4) { // TV
                    productId = 'tv';
                } else if (index === 5) { // Watch
                    productId = 'watch';
                } else {
                    productId = 'sony-headphones';
                }
                
                const product = productData[productId];
                
                if (product) {
                    document.getElementById('popupTitle').textContent = product.title;
                    document.getElementById('popupImage').src = product.image;
                    document.getElementById('popupCurrentPrice').textContent = product.currentPrice;
                    document.getElementById('popupOldPrice').textContent = product.oldPrice;
                    document.getElementById('popupDiscount').textContent = product.discount;
                    document.getElementById('popupDescription').textContent = product.description;
                    
                    const ratingText = document.querySelector('.rating-text');
                    ratingText.textContent = `${product.rating} (${product.reviews} reviews)`;
                    
                    productPopup.classList.add('active');
                    document.body.style.overflow = 'hidden';
                }
            });
        });

        // Close popup
        popupClose.addEventListener('click', () => {
            productPopup.classList.remove('active');
            document.body.style.overflow = 'auto';
        });

        // Close popup when clicking outside
        productPopup.addEventListener('click', (e) => {
            if (e.target === productPopup) {
                productPopup.classList.remove('active');
                document.body.style.overflow = 'auto';
            }
        });

        // Quantity controls
        const decreaseQty = document.getElementById('decreaseQty');
        const increaseQty = document.getElementById('increaseQty');
        const quantityInput = document.getElementById('quantityInput');

        if (decreaseQty && increaseQty && quantityInput) {
            decreaseQty.addEventListener('click', () => {
                let value = parseInt(quantityInput.value);
                if (value > 1) {
                    quantityInput.value = value - 1;
                }
            });

            increaseQty.addEventListener('click', () => {
                let value = parseInt(quantityInput.value);
                if (value < 10) {
                    quantityInput.value = value + 1;
                }
            });

            // Add to cart from popup
            const popupAddToCart = document.getElementById('popupAddToCart');
            if (popupAddToCart) {
                popupAddToCart.addEventListener('click', () => {
                    const productTitle = document.getElementById('popupTitle').textContent;
                    const quantity = parseInt(quantityInput.value);
                    const badge = document.querySelector('.btn-icon[title="Cart"] .badge');
                    let count = parseInt(badge.textContent);
                    badge.textContent = count + quantity;
                    
                    // Show notification
                    const notification = document.createElement('div');
                    notification.textContent = `${quantity} x ${productTitle} added to cart!`;
                    notification.style.cssText = `
                        position: fixed;
                        top: 100px;
                        right: 20px;
                        background: var(--success-green);
                        color: white;
                        padding: 1rem 1.5rem;
                        border-radius: 10px;
                        z-index: 10000;
                        box-shadow: 0 5px 15px rgba(0,0,0,0.3);
                        animation: slideInRight 0.3s ease;
                    `;
                    document.body.appendChild(notification);
                    
                    setTimeout(() => {
                        notification.style.animation = 'slideOutRight 0.3s ease';
                        setTimeout(() => {
                            document.body.removeChild(notification);
                        }, 300);
                    }, 3000);
                    
                    setTimeout(() => {
                        productPopup.classList.remove('active');
                        document.body.style.overflow = 'auto';
                    }, 1000);
                });
            }
        }
    }

    // Close popup with Escape key
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && productPopup && productPopup.classList.contains('active')) {
            productPopup.classList.remove('active');
            document.body.style.overflow = 'auto';
        }
    });

    // FOR THE ACCOUNT ON THE NAVBAR
    // Account Dropdown Toggle
        const accountButton = document.getElementById('accountButton');
        const dropdownMenu = document.getElementById('dropdownMenu');

        accountButton.addEventListener('click', (e) => {
            e.stopPropagation();
            accountButton.classList.toggle('active');
            dropdownMenu.classList.toggle('active');
        });

        // Close dropdown when clicking outside
        document.addEventListener('click', (e) => {
            if (!accountButton.contains(e.target) && !dropdownMenu.contains(e.target)) {
                accountButton.classList.remove('active');
                dropdownMenu.classList.remove('active');
            }
        });

        // Prevent dropdown from closing when clicking inside
        dropdownMenu.addEventListener('click', (e) => {
            e.stopPropagation();
        });

        
        // Close dropdown on escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                accountButton.classList.remove('active');
                dropdownMenu.classList.remove('active');
            }
        });

       

       
</script>
